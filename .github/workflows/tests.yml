name: Tests

# Runs the tests/ suite on every push and PR. Installs only what the tested
# modules actually import, not the full requirements.txt (torch, torch-
# geometric, transformers, spacy) — keeping CI fast matters more here than
# exercising the full dependency stack, which none of these tests touch
# (no Neo4j, no GPU, no live API keys or network calls required — every
# test that would otherwise hit a real network call mocks it instead).
#
# hmmlearn/numpy/requests are for test_hmm_regime.py specifically (it
# imports risk/hmm_regime.py directly to test the real fitting/inference
# logic against synthetic data — pulls in scipy/scikit-learn transitively
# via hmmlearn, still far lighter than the torch/transformers stack).
on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test dependencies
        run: pip install pytest python-dotenv hmmlearn numpy requests
      - name: Run tests
        run: python -m pytest tests/ -v
